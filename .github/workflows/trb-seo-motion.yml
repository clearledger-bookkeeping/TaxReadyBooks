name: TaxReady Books SEO and motion patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trb-seo-motion.yml'
      - 'scripts/add-seo-motion.py'

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[seo-motion]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply SEO and motion enhancements
        run: python scripts/add-seo-motion.py
      - name: Commit enhancement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "[seo-motion] Improve SEO metadata and add scroll animations"
          git push
